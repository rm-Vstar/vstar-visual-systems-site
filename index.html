    <script>
      // Apply the theme before first paint to avoid a flash of the wrong theme.
      // Stored modes: 'auto' (follow the system), 'light', 'dark'. Legacy 'dark'/'light' values are honored.
      try {
        var stored = localStorage.getItem('vstar-theme');
        var mode = stored || 'auto';
        var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        // Set explicitly for both themes: the token bridge keys off [data-theme].
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { /* storage unavailable */ }
    </script>
